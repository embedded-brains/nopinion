name: Build and test
on:
  push:
    branches:
    - main
  pull_request:
    branches:
    - main
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - name: Check
      run: make check
  coverage:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - name: Install gcovr
      run: pipx install gcovr
    - name: Coverage
      run: make coverage
  reuse:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - uses: fsfe/reuse-action@v5
