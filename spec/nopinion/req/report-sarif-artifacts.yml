post-conditions:
- name: Artifacts
  states:
  - name: OneDistinct
    test-code: |
      CheckArtifacts(
        ctx,
        "{\"location\":{\"uri\":\"%s/a.a\"}},"
        "{\"location\":{\"uri\":\"m.o\"},\"parentIndex\":0},"
        "{\"location\":{\"uri\":\"nn.o\"},\"parentIndex\":0}"
      );
    text: |
      The artifacts of the run shall be the archive, the member m.o with the parent
      index 0 and the member nn.o with the parent index 0.
  - name: OneDuplicate
    test-code: |
      CheckArtifacts(
        ctx,
        "{\"location\":{\"uri\":\"%s/a.a\"}},"
        "{\"location\":{\"uri\":\"m.o\"},\"parentIndex\":0}"
      );
    text: |
      The artifacts of the run shall be the archive and the member m.o with the
      parent index 0.
  - name: TwoDistinct
    test-code: |
      CheckArtifacts(
        ctx,
        "{\"location\":{\"uri\":\"%s/a.a\"}},"
        "{\"location\":{\"uri\":\"m.o\"},\"parentIndex\":0},"
        "{\"location\":{\"uri\":\"nn.o\"},\"parentIndex\":0},"
        "{\"location\":{\"uri\":\"%s/b.a\"}},"
        "{\"location\":{\"uri\":\"m.o\"},\"parentIndex\":3},"
        "{\"location\":{\"uri\":\"nn.o\"},\"parentIndex\":3}"
      );
    text: |
      The artifacts of the run shall be the first archive, its members m.o and nn.o
      with the parent index 0, the second archive, and its members m.o and nn.o
      with the parent index 3.
  - name: TwoDuplicate
    test-code: |
      CheckArtifacts(
        ctx,
        "{\"location\":{\"uri\":\"%s/a.a\"}},"
        "{\"location\":{\"uri\":\"m.o\"},\"parentIndex\":0},"
        "{\"location\":{\"uri\":\"%s/b.a\"}},"
        "{\"location\":{\"uri\":\"m.o\"},\"parentIndex\":2}"
      );
    text: |
      The artifacts of the run shall be the first archive, its member m.o with the
      parent index 0, the second archive, and its member m.o with the parent index
      2.
  - name: BasedDistinct
    test-code: |
      CheckArtifacts(
        ctx,
        "{\"location\":{\"uri\":\"a.a\",\"uriBaseId\":\"X\"}},"
        "{\"location\":{\"uri\":\"m.o\"},\"parentIndex\":0},"
        "{\"location\":{\"uri\":\"nn.o\"},\"parentIndex\":0},"
        "{\"location\":{\"uri\":\"a.a\",\"uriBaseId\":\"Y\"}},"
        "{\"location\":{\"uri\":\"m.o\"},\"parentIndex\":3},"
        "{\"location\":{\"uri\":\"nn.o\"},\"parentIndex\":3}"
      );
    text: |
      The artifacts of the run shall be the archive a.a of the URI base id X, its
      members m.o and nn.o with the parent index 0, the archive a.a of the URI
      base id Y, and its members m.o and nn.o with the parent index 3.
  - name: BasedDuplicate
    test-code: |
      CheckArtifacts(
        ctx,
        "{\"location\":{\"uri\":\"a.a\",\"uriBaseId\":\"X\"}},"
        "{\"location\":{\"uri\":\"m.o\"},\"parentIndex\":0},"
        "{\"location\":{\"uri\":\"a.a\",\"uriBaseId\":\"Y\"}},"
        "{\"location\":{\"uri\":\"m.o\"},\"parentIndex\":2}"
      );
    text: |
      The artifacts of the run shall be the archive a.a of the URI base id X, its
      member m.o with the parent index 0, the archive a.a of the URI base id Y,
      and its member m.o with the parent index 2.
  test-epilogue: null
  test-prologue: null
- name: Indices
  states:
  - name: OneDistinct
    test-code: |
      static const TxSarifIndex indices[] = { { "m.o", 1 }, { "nn.o", 2 } };

      CheckIndices( ctx, indices, 2 );
    text: |
      The results shall name the member m.o of the artifact 1 and the member nn.o
      of the artifact 2.
  - name: OneDuplicate
    test-code: |
      static const TxSarifIndex indices[] = { { "m.o", 1 }, { "m.o", 1 } };

      CheckIndices( ctx, indices, 2 );
    text: |
      The results shall name the member m.o of the artifact 1 twice.
  - name: TwiceDistinct
    test-code: |
      static const TxSarifIndex indices[] = { { "m.o", 1 }, { "nn.o", 2 }, { "m.o", 1 }, { "nn.o", 2 } };

      CheckIndices( ctx, indices, 4 );
    text: |
      The results shall name the member m.o of the artifact 1, the member nn.o of
      the artifact 2, the member m.o of the artifact 1 and the member nn.o of the
      artifact 2.
  - name: TwiceDuplicate
    test-code: |
      static const TxSarifIndex indices[] = { { "m.o", 1 }, { "m.o", 1 }, { "m.o", 1 }, { "m.o", 1 } };

      CheckIndices( ctx, indices, 4 );
    text: |
      The results shall name the member m.o of the artifact 1 four times.
  - name: TwoDistinct
    test-code: |
      static const TxSarifIndex indices[] = { { "m.o", 1 }, { "nn.o", 2 }, { "m.o", 4 }, { "nn.o", 5 } };

      CheckIndices( ctx, indices, 4 );
    text: |
      The results shall name the member m.o of the artifact 1, the member nn.o of
      the artifact 2, the member m.o of the artifact 4 and the member nn.o of the
      artifact 5.
  - name: TwoDuplicate
    test-code: |
      static const TxSarifIndex indices[] = { { "m.o", 1 }, { "m.o", 1 }, { "m.o", 3 }, { "m.o", 3 } };

      CheckIndices( ctx, indices, 4 );
    text: |
      The results shall name the member m.o of the artifact 1 twice and the member
      m.o of the artifact 3 twice.
  test-epilogue: null
  test-prologue: null
pre-conditions:
- name: Operands
  states:
  - name: One
    test-code: |
      ctx->files[ 0 ] = ctx->a;
      ctx->files[ 1 ] = NULL;
    text: |
      While the file operand names an archive.
  - name: Twice
    test-code: |
      ctx->files[ 0 ] = ctx->a;
      ctx->files[ 1 ] = ctx->a;
    text: |
      While two file operands name the same archive.
  - name: Two
    test-code: |
      ctx->files[ 0 ] = ctx->a;
      ctx->files[ 1 ] = ctx->b;
    text: |
      While two file operands name two archives with the same members.
  - name: Based
    test-code: |
      ctx->files[ 0 ] = ctx->x;
      ctx->files[ 1 ] = ctx->y;
      (void) snprintf( ctx->base_x, sizeof( ctx->base_x ), "X=%s/x", ctx->dir );
      (void) snprintf( ctx->base_w, sizeof( ctx->base_w ), "W=%s", ctx->dir );
      (void) snprintf( ctx->base_y, sizeof( ctx->base_y ), "Y=%s/y", ctx->dir );
      ctx->based = true;
    text: |
      While the options -b X=DIR/x, -b W=DIR and -b Y=DIR/y are given in this
      order, while two file operands name the archives x/a.a and y/a.a of the
      directory DIR with the same members.
  test-epilogue: null
  test-prologue: null
- name: Members
  states:
  - name: Distinct
    test-code: |
      ctx->second = "nn.o/";
    text: |
      While each archive holds the members m.o and nn.o, each with one
      ${../glossary/finding:/term}.
  - name: Duplicate
    test-code: |
      ctx->second = "m.o/";
    text: |
      While each archive holds two members with the name m.o, each with one
      ${../glossary/finding:/term}.
  test-epilogue: null
  test-prologue: null
rationale: |
  Dimension Operands covers the archives of the run, 4 states.

  Dimension Members covers the names of the members of an archive, 2 states.

  An archive of the GNU binutils may hold two members with the same name. The
  run lists each archive once and each name of a member of it once. Two results
  of members with the same name therefore name the same artifact. An archive is
  the same, if its URI and its URI base id are the same.
