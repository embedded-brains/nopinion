enabled-by: true
functional-type: action
links:
- role: requirement-refinement
  uid: cli
post-conditions:
- name: Status
  states:
  - name: Success
    test-code: |
      T_eq_int( ctx->status, 0 );
    text: |
      The exit status shall be 0.
  - name: Finding
    test-code: |
      T_eq_int( ctx->status, 1 );
    text: |
      The exit status shall be 1.
  - name: Error
    test-code: |
      T_eq_int( ctx->status, 2 );
    text: |
      The exit status shall be 2.
  test-epilogue: null
  test-prologue: null
- name: Output
  states:
  - name: Usage
    test-code: |
      T_eq_int( strncmp( ctx->out, "usage: nopinion ", 16 ), 0 );
    text: |
      The errata checker shall write the usage text to the standard output.
  - name: Empty
    test-code: |
      T_eq_str( ctx->out, "" );
    text: |
      The errata checker shall write nothing to the standard output.
  - name: Report
    test-code: |
      T_eq_str( ctx->out, ctx->line_0 );
    text: |
      The errata checker shall write the report line of the
      ${../glossary/definite-finding:/term} to the standard output.
  - name: ReportIndirect
    test-code: |
      char expected[ 512 ];

      (void) snprintf(
        expected,
        sizeof( expected ),
        "%s%s",
        ctx->line_0,
        ctx->line_16
      );
      T_eq_str( ctx->out, expected );
    text: |
      The errata checker shall write the report lines of the
      ${../glossary/definite-finding:/term} and of the
      ${../glossary/possible-finding:/term} to the standard output.
  - name: Possible
    test-code: |
      T_eq_str( ctx->out, ctx->line_possible );
    text: |
      The errata checker shall write the report line of the
      ${../glossary/possible-finding:/term} to the standard output.
  - name: PossibleVerbose
    test-code: |
      char expected[ 512 ];

      (void) snprintf(
        expected,
        sizeof( expected ),
        "%s  00000000  c2220000\n  00000004  82006001\n            ?\n",
        ctx->line_possible
      );
      T_eq_str( ctx->out, expected );
    text: |
      The errata checker shall write the report line of the
      ${../glossary/possible-finding:/term} and its instruction sequence to the
      standard output.
  - name: ReportVerbose
    test-code: |
      char expected[ 512 ];

      (void) snprintf(
        expected,
        sizeof( expected ),
        "%s  00000000  c2220000\n  00000004  82006001\n  00000008  c2220000\n",
        ctx->line_0
      );
      T_eq_str( ctx->out, expected );
    text: |
      The errata checker shall write the report line of the
      ${../glossary/definite-finding:/term} and its instruction sequence to the
      standard output.
  test-epilogue: null
  test-prologue: null
- name: Errors
  states:
  - name: Empty
    test-code: |
      T_eq_str( ctx->err, "" );
    text: |
      The errata checker shall write nothing to the standard error.
  - name: Usage
    test-code: |
      T_eq_int( strncmp( ctx->err, "usage: nopinion ", 16 ), 0 );
    text: |
      The errata checker shall write the usage text to the standard error.
  - name: BaseMessage
    test-code: |
      T_eq_str( ctx->err, "nopinion: tx-no-such-dir: No such file or directory\n" );
    text: |
      The errata checker shall write the error message of the missing directory
      of the option -b to the standard error.
  - name: Message
    test-code: |
      T_eq_str( ctx->err, ctx->message );
    text: |
      The errata checker shall write the error message of the missing file to the
      standard error.
  - name: Statistics
    test-code: |
      T_eq_str( ctx->err, ctx->statistics );
    text: |
      The errata checker shall write the statistics to the standard error.
  - name: MessageStatistics
    test-code: |
      char expected[ 512 ];

      (void) snprintf(
        expected,
        sizeof( expected ),
        "%s%s",
        ctx->message,
        ctx->statistics
      );
      T_eq_str( ctx->err, expected );
    text: |
      The errata checker shall write the error message of the missing file and the
      statistics to the standard error.
  test-epilogue: null
  test-prologue: null
pre-conditions:
- name: Option
  states:
  - name: None
    test-code: |
      static const char *const options[] = { NULL };

      ctx->options = options;
    text: |
      While no option is given.
  - name: BaseNoName
    test-code: |
      static const char *const options[] = { "-b", "=.", NULL };

      ctx->options = options;
    text: |
      While the option -b names no URI base id.
  - name: BaseNoDirectory
    test-code: |
      static const char *const options[] = { "-b", "PKG", NULL };

      ctx->options = options;
    text: |
      While the argument of the option -b holds no equals sign.
  - name: BaseMissing
    test-code: |
      static const char *const options[] = { "-b", "PKG=tx-no-such-dir", NULL };

      ctx->options = options;
    text: |
      While the option -b names a directory which does not exist.
  - name: FormatText
    test-code: |
      static const char *const options[] = { "-f", "text", NULL };

      ctx->options = options;
    text: |
      While the option -f text is given.
  - name: FormatUnknown
    test-code: |
      static const char *const options[] = { "-f", "xml", NULL };

      ctx->options = options;
    text: |
      While the option -f names an unknown format.
  - name: Help
    test-code: |
      static const char *const options[] = { "-h", NULL };

      ctx->options = options;
    text: |
      While the option -h is given.
  - name: Indirect
    test-code: |
      static const char *const options[] = { "-i", NULL };

      ctx->options = options;
    text: |
      While the option -i is given.
  - name: Quiet
    test-code: |
      static const char *const options[] = { "-q", NULL };

      ctx->options = options;
    text: |
      While the option -q is given.
  - name: Statistics
    test-code: |
      static const char *const options[] = { "-s", NULL };

      ctx->options = options;
    text: |
      While the option -s is given.
  - name: Verbose
    test-code: |
      static const char *const options[] = { "-v", NULL };

      ctx->options = options;
    text: |
      While the option -v is given.
  - name: Note0009
    test-code: |
      static const char *const options[] = { "-t", "0009", NULL };

      ctx->options = options;
    text: |
      While the option -t selects GRLIB-TN-0009.
  - name: Note0011
    test-code: |
      static const char *const options[] = { "-t", "0011", NULL };

      ctx->options = options;
    text: |
      While the option -t selects GRLIB-TN-0011.
  - name: Note0012
    test-code: |
      static const char *const options[] = { "-t", "0012", NULL };

      ctx->options = options;
    text: |
      While the option -t selects GRLIB-TN-0012.
  - name: Note0013
    test-code: |
      static const char *const options[] = { "-t", "0013", NULL };

      ctx->options = options;
    text: |
      While the option -t selects GRLIB-TN-0013.
  - name: NoteList
    test-code: |
      static const char *const options[] = { "-t", ",0011,0009,", NULL };

      ctx->options = options;
    text: |
      While the option -t selects GRLIB-TN-0011 and GRLIB-TN-0009 with empty list
      elements.
  - name: NoteUnknown
    test-code: |
      static const char *const options[] = { "-t", "0010", NULL };

      ctx->options = options;
    text: |
      While the option -t names an unknown technical note.
  - name: NoteLength
    test-code: |
      static const char *const options[] = { "-t", "00099", NULL };

      ctx->options = options;
    text: |
      While the option -t names a technical note with more than four digits.
  - name: NoteEmpty
    test-code: |
      static const char *const options[] = { "-t", ",", NULL };

      ctx->options = options;
    text: |
      While the option -t names no technical note.
  - name: Unknown
    test-code: |
      static const char *const options[] = { "-x", NULL };

      ctx->options = options;
    text: |
      While an unknown option is given.
  - name: NoArgument
    test-code: |
      static const char *const options[] = { "-t", NULL };

      ctx->options = options;
    text: |
      While the option -t is given without an argument.
  test-epilogue: null
  test-prologue: null
- name: Files
  states:
  - name: NoOperand
    test-code: |
      ctx->files[ 0 ] = NULL;
    text: |
      While no file operand is given.
  - name: Clean
    test-code: |
      ctx->files[ 0 ] = ctx->clean;
      ctx->files[ 1 ] = NULL;
    text: |
      While the file operand names an ELF file without a finding.
  - name: Finding
    test-code: |
      ctx->files[ 0 ] = ctx->finding;
      ctx->files[ 1 ] = NULL;
    text: |
      While the file operand names an ELF file with a finding.
  - name: Possible
    test-code: |
      ctx->files[ 0 ] = ctx->possible;
      ctx->files[ 1 ] = NULL;
    text: |
      While the file operand names an ELF file with only a
      ${../glossary/possible-finding:/term}.
  - name: Missing
    test-code: |
      ctx->files[ 0 ] = ctx->missing;
      ctx->files[ 1 ] = NULL;
    text: |
      While the file operand names a file which does not exist.
  - name: Both
    test-code: |
      ctx->files[ 0 ] = ctx->finding;
      ctx->files[ 1 ] = ctx->missing;
      ctx->files[ 2 ] = NULL;
    text: |
      While the file operands name an ELF file with a finding and a file which does
      not exist.
  test-epilogue: null
  test-prologue: null
rationale: |
  Dimension Option covers the options of the errata checker, 21 states.

  Dimension Files covers the file operands, 6 states.

  The usage text documents the options and the exit status. The exit status is 2
  after an error, else 1 after a ${../glossary/finding:/term}, else 0. The
  statistics line counts the instructions of the checked
  ${../glossary/code-section:/term} instances and the findings.

  The test writes the files into a temporary directory of the current directory.
  The file with a ${../glossary/finding:/term} holds a store, an ADD, a store, a
  load, a store, a trap always instruction, a store and a load. The first store
  gives a ${../glossary/definite-finding:/term} of the stale cache entry erratum.
  The store at offset 16 gives a ${../glossary/possible-finding:/term} only with
  the option -i. The file without a ${../glossary/finding:/term} holds a NOP.
