post-conditions:
- name: Status
  states:
  - name: Success
    test-code: |
      T_eq_int( ctx->status, 0 );
    text: |
      The exit status of the program shall be 0.
  - name: Error
    test-code: |
      T_eq_int( ctx->status, 2 );
    text: |
      The exit status of the program shall be 2.
  test-epilogue: null
  test-prologue: null
- name: Output
  states:
  - name: Usage
    test-code: |
      T_eq_int( strncmp( ctx->out, "usage: nopinion ", 16 ), 0 );
    text: |
      The program shall write the usage text to its standard output.
  - name: Empty
    test-code: |
      T_eq_str( ctx->out, "" );
    text: |
      The program shall write nothing to its standard output.
  test-epilogue: null
  test-prologue: null
pre-conditions:
- name: Option
  states:
  - name: Help
    test-code: |
      ctx->option = "-h";
    text: |
      While the option -h is given.
  - name: Unknown
    test-code: |
      ctx->option = "-x";
    text: |
      While an unknown option is given.
  test-epilogue: null
  test-prologue: null
rationale: |
  Dimension Option covers the outcomes of the options which need no file, 2
  states.

  The program nopinion passes its arguments, its standard output and its standard
  error to the errata checker. The test runs the program which the environment
  variable NOPINION names. The program writes the usage text for the option -h to
  the standard output and for an unknown option to the standard error.
references: []
requirement-type: functional
skip-reasons: {}
test-action: |
  const char *program = getenv( "NOPINION" );
  char        command[ 512 ];
  FILE       *f;
  size_t      n;
  int         status;

  T_assert_not_null( program );
  (void) snprintf(
    command,
    sizeof( command ),
    "%s %s 2>/dev/null",
    program,
    ctx->option
  );
  f = popen( command, "r" );
  T_assert_not_null( f );
  n = fread( ctx->out, 1, sizeof( ctx->out ) - 1, f );
  ctx->out[ n ] = '\0';
  status = pclose( f );
  T_assert_true( WIFEXITED( status ) );
  ctx->status = WEXITSTATUS( status );
