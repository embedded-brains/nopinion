pre-conditions:
- name: Instruction
  states:
  - name: BiccCond
    test-code: |
      ctx->kind = KindBiccCond;
    text: |
      While the instruction is a conditional branch on integer condition codes with
      the annul bit cleared.
  - name: BiccCondAnnul
    test-code: |
      ctx->kind = KindBiccCondAnnul;
    text: |
      While the instruction is a conditional branch on integer condition codes with
      the annul bit set.
  - name: BiccAlways
    test-code: |
      ctx->kind = KindBiccAlways;
    text: |
      While the instruction is a branch always on integer condition codes with the
      annul bit cleared.
  - name: BiccAlwaysAnnul
    test-code: |
      ctx->kind = KindBiccAlwaysAnnul;
    text: |
      While the instruction is a branch always on integer condition codes with the
      annul bit set.
  - name: BiccNever
    test-code: |
      ctx->kind = KindBiccNever;
    text: |
      While the instruction is a branch never on integer condition codes with the
      annul bit cleared.
  - name: BiccNeverAnnul
    test-code: |
      ctx->kind = KindBiccNeverAnnul;
    text: |
      While the instruction is a branch never on integer condition codes with the
      annul bit set.
  - name: FbfccCond
    test-code: |
      ctx->kind = KindFbfccCond;
    text: |
      While the instruction is a conditional branch on floating-point condition codes
      with the annul bit cleared.
  - name: FbfccCondAnnul
    test-code: |
      ctx->kind = KindFbfccCondAnnul;
    text: |
      While the instruction is a conditional branch on floating-point condition codes
      with the annul bit set.
  - name: CbcccCond
    test-code: |
      ctx->kind = KindCbcccCond;
    text: |
      While the instruction is a conditional branch on coprocessor condition codes
      with the annul bit cleared.
  - name: Call
    test-code: |
      ctx->kind = KindCall;
    text: |
      While the instruction is a CALL instruction.
  - name: Jmpl
    test-code: |
      ctx->kind = KindJmpl;
    text: |
      While the instruction is a JMPL instruction.
  - name: Rett
    test-code: |
      ctx->kind = KindRett;
    text: |
      While the instruction is an RETT instruction.
  - name: TrapAlways
    test-code: |
      ctx->kind = KindTrapAlways;
    text: |
      While the instruction is a trap always instruction.
  - name: TrapCond
    test-code: |
      ctx->kind = KindTrapCond;
    text: |
      While the instruction is a conditional trap instruction.
  - name: Other
    test-code: |
      ctx->kind = KindOther;
    text: |
      While the instruction is an instruction which transfers no control.
  test-epilogue: null
  test-prologue: null
- name: Target
  states:
  - name: Inside
    test-code: |
      ctx->disp = 4;
      ctx->relocated = false;
    text: |
      While the PC-relative target of the instruction is in the
      ${../glossary/code-section:/term}.
  - name: Outside
    test-code: |
      ctx->disp = 100;
      ctx->relocated = false;
    text: |
      While the PC-relative target of the instruction is outside the
      ${../glossary/code-section:/term}.
  - name: Relocated
    test-code: |
      ctx->disp = 4;
      ctx->relocated = true;
    text: |
      While a relocation applies to the instruction.
  test-epilogue: null
  test-prologue: null
- name: SlotIsTarget
  states:
  - name: 'Yes'
    test-code: |
      ctx->slot_is_target = true;
    text: |
      While the delay slot is the target of another branch.
  - name: 'No'
    test-code: |
      ctx->slot_is_target = false;
    text: |
      While the delay slot is the target of no other branch.
  test-epilogue: null
  test-prologue: null
- name: Indirect
  states:
  - name: 'Yes'
    test-code: |
      TxSetIncludeIndirect( true );
    text: |
      While the option -i is given.
  - name: 'No'
    test-code: |
      TxSetIncludeIndirect( false );
    text: |
      While the option -i is not given.
  test-epilogue: null
  test-prologue: null
rationale: |
  Dimension Instruction covers the control-transfer instructions of SPARC V8 by
  their effect on the delay slot and an instruction which transfers no control,
  15 states.

  Dimension Target covers the targets of an instruction, 3 states.

  Dimension SlotIsTarget covers the branches of the
  ${../glossary/code-section:/term} to the delay slot, 2 states.

  Dimension Indirect covers the options of the errata checker, 2 states.

  The test checks the ${../glossary/code-section:/term} with the instruction at
  offset 0 and a store of double word size in its delay slot. Sequence B of the
  stale cache entry erratum then gives a finding for that store, if the flow of
  execution reaches a store after it. The instruction after the delay slot holds
  the store in the fall-through probe. The target of the instruction holds the
  store in the target probe.

  Section B.21 of SPARC V8 states the annul bit. A conditional branch with the
  annul bit set executes the delay slot only if it branches. A branch always with
  the annul bit set never executes the delay slot. A branch never with the annul
  bit set never executes the delay slot either. A trap instruction has no delay
  slot.

  The target of JMPL and RETT depends on a register. The flow of execution ends
  there unless the option -i is given. The option makes the target an
  ${../glossary/unknown-instruction:/term}. A PC-relative target outside the
  ${../glossary/code-section:/term} and the target of a relocated instruction are
  ${../glossary/unknown-instruction:/term} instructions.
