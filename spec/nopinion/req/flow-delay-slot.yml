post-conditions:
- name: Fall
  states:
  - name: None
    test-code: |
      T_eq_int( ctx->fall, TX_FLOW_NONE );
    text: |
      The errata checker shall report no ${../glossary/finding:/term} for the store
      of double word size in the fall-through probe.
  - name: Definite
    test-code: |
      T_eq_int( ctx->fall, TX_FLOW_DEFINITE );
    text: |
      The errata checker shall report one ${../glossary/definite-finding:/term} for
      the store of double word size in the fall-through probe.
  - name: Possible
    test-code: |
      T_eq_int( ctx->fall, TX_FLOW_POSSIBLE );
    text: |
      The errata checker shall report one ${../glossary/possible-finding:/term} for
      the store of double word size in the fall-through probe.
  test-epilogue: null
  test-prologue: null
- name: Branch
  states:
  - name: None
    test-code: |
      T_eq_int( ctx->branch, TX_FLOW_NONE );
    text: |
      The errata checker shall report no ${../glossary/finding:/term} for the store
      of double word size in the target probe.
  - name: Definite
