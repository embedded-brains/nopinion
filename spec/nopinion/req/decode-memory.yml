post-conditions:
- name: Class
  states:
  - name: StoreWord
    test-code: |
      T_true( ctx->probe.sequence_a );
      T_false( ctx->probe.sequence_b );
      T_false( ctx->probe.middle );
      T_false( ctx->probe.in_delay_slot );
    text: |
      The errata checker shall classify the instruction as a store of word size or
      less.
  - name: StoreDouble
    test-code: |
      T_false( ctx->probe.sequence_a );
      T_true( ctx->probe.sequence_b );
      T_false( ctx->probe.middle );
      T_false( ctx->probe.in_delay_slot );
    text: |
      The errata checker shall classify the instruction as a store of double word
      size.
  - name: Atomic
    test-code: |
      T_false( ctx->probe.sequence_a );
      T_false( ctx->probe.sequence_b );
      T_false( ctx->probe.middle );
      T_true( ctx->probe.in_delay_slot );
    text: |
      The errata checker shall classify the instruction as an atomic load-store
      instruction.
  - name: Load
    test-code: |
      T_false( ctx->probe.sequence_a );
      T_false( ctx->probe.sequence_b );
      T_false( ctx->probe.middle );
      T_false( ctx->probe.in_delay_slot );
    text: |
      The errata checker shall classify the instruction as a load which is no atomic
      load-store instruction.
  test-epilogue: null
  test-prologue: null
