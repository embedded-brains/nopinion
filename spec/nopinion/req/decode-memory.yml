rationale: |
  Dimension Instruction covers the memory instructions of table F-4 of SPARC V8
  and CASA, 40 states.

  The instructions of section B.1, B.2 and B.3 are loads. The instructions of
  section B.4, B.5 and B.6 are stores. A store of a double word stores two
  registers. The instructions of section B.7 and B.8 and CASA are atomic
  load-store instructions. An undefined op3 field causes an illegal_instruction
  trap, so the instruction stores nothing.

  The test observes the class through the stale cache entry erratum and the AHB
  lock release erratum. A store of word size or less starts sequence A. A store
  of double word size starts sequence B. No memory instruction is the middle
  instruction of sequence A. Only an atomic instruction in a delay slot gives a
  finding of the AHB lock release erratum.
