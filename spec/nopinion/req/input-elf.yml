  TxImageInit( &image );
  TxAppend( &image, TxSt() );
  TxAppend( &image, TxAdd() );
  TxAppend( &image, TxSt() );
  ctx->size = TxBuildElf( &image, ctx->buf, sizeof( ctx->buf ) );
