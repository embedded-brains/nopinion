enabled-by: true
functional-type: action
links:
- role: requirement-refinement
  uid: input
post-conditions:
- name: Error
  states:
  - name: None
    test-code: |
      T_eq_str( TxErrors(), "" );
    text: |
      The errata checker shall report no error.
  - name: NotElf
    test-code: |
      T_eq_str( TxErrors(), "nopinion: t.o: not an ELF file\n" );
    text: |
      The errata checker shall report the error "not an ELF file" for the file.
  - name: NotElf32Be
    test-code: |
      T_eq_str( TxErrors(), "nopinion: t.o: not an ELF32 big-endian file\n" );
    text: |
      The errata checker shall report the error "not an ELF32 big-endian file" for
      the file.
  - name: NotSparc
    test-code: |
      T_eq_str( TxErrors(), "nopinion: t.o: not a SPARC ELF file\n" );
    text: |
      The errata checker shall report the error "not a SPARC ELF file" for the file.
  - name: BadSectionHeaders
    test-code: |
      T_eq_str( TxErrors(), "nopinion: t.o: bad section headers\n" );
    text: |
      The errata checker shall report the error "bad section headers" for the file.
  - name: BadStringTable
    test-code: |
      T_eq_str( TxErrors(), "nopinion: t.o: bad string table\n" );
    text: |
      The errata checker shall report the error "bad string table" for the file.
  - name: BadCodeSection
    test-code: |
      T_eq_str( TxErrors(), "nopinion: t.o: bad code section\n" );
    text: |
      The errata checker shall report the error "bad code section" for the file.
  - name: OutOfMemory
    test-code: |
      T_eq_str( TxErrors(), "nopinion: t.o: out of memory\n" );
    text: |
      The errata checker shall report the error "out of memory" for the file.
  test-epilogue: null
  test-prologue: null
- name: Checked
  states:
  - name: 'Yes'
    test-code: |
      T_eq_int( TxCountAt( ctx->report, 0, "TN-0009" ), 1 );
    text: |
      The errata checker shall check the ${../glossary/code-section:/term}.
  - name: 'No'
    test-code: |
      T_eq_int( TxCountAt( ctx->report, 0, "TN-0009" ), 0 );
    text: |
      The errata checker shall check no ${../glossary/code-section:/term}.
  test-epilogue: null
  test-prologue: null
pre-conditions:
- name: File
  states:
  - name: Valid
    test-code: |
      /* The file is valid */
    text: |
      While the file is a valid ELF file with a ${../glossary/code-section:/term}.
  - name: Short
    test-code: |
      ctx->size = 51;
    text: |
      While the file is shorter than an ELF header.
  - name: Magic
    test-code: |
      ctx->buf[ 1 ] = 'X';
    text: |
      While the file is an ELF file with a wrong magic number.
  - name: Class64
    test-code: |
      ctx->buf[ 4 ] = 2;
    text: |
      While the file is an ELF file of the 64-bit class.
  - name: LittleEndian
    test-code: |
      ctx->buf[ 5 ] = 1;
    text: |
      While the file is an ELF file with little-endian data.
  - name: OtherMachine
    test-code: |
      TxPut16( ctx->buf + 18, 3 );
    text: |
      While the file is an ELF file for another machine than SPARC.
  - name: Sparc32Plus
    test-code: |
      TxPut16( ctx->buf + 18, 18 );
    text: |
      While the file is an ELF file for the machine SPARC32PLUS.
  - name: NoSections
    test-code: |
      TxPut16( ctx->buf + 48, 0 );
    text: |
      While the file is an ELF file without section headers.
  - name: EntrySize
    test-code: |
      TxPut16( ctx->buf + 46, 39 );
    text: |
      While the file is an ELF file with a section header entry size of less than 40
      bytes.
  - name: TableOutside
    test-code: |
      TxPut32( ctx->buf + 32, 0x10000 );
    text: |
      While the file is an ELF file whose section header table exceeds the file.
  - name: StringIndex
    test-code: |
      TxPut16( ctx->buf + 50, 6 );
    text: |
      While the file is an ELF file whose section name string table index exceeds the
      section count.
  - name: StringOutside
    test-code: |
      TxPut32(
        ctx->buf + TxSectionHeader( ctx->buf, TX_SECTION_SHSTRTAB ) + 16,
        0x10000
      );
    text: |
      While the file is an ELF file whose section name string table exceeds the file.
  - name: CodeOutside
    test-code: |
      TxPut32(
        ctx->buf + TxSectionHeader( ctx->buf, TX_SECTION_TEXT ) + 16,
        0x10000
      );
    text: |
      While the file is an ELF file whose ${../glossary/code-section:/term} exceeds
      the file.
  - name: CodeTooLong
    test-code: |
      TxPut32(
        ctx->buf + TxSectionHeader( ctx->buf, TX_SECTION_TEXT ) + 20,
        0x10000
      );
    text: |
      While the file is an ELF file whose ${../glossary/code-section:/term} starts in
      the file and ends beyond it.
  - name: CodeName
    test-code: |
      TxPut32( ctx->buf + TxSectionHeader( ctx->buf, TX_SECTION_TEXT ), 0x10000 );
    text: |
      While the file is an ELF file whose ${../glossary/code-section:/term} name
      exceeds the section name string table.
  - name: CodeSmall
    test-code: |
      TxPut32( ctx->buf + TxSectionHeader( ctx->buf, TX_SECTION_TEXT ) + 20, 3 );
    text: |
      While the file is an ELF file whose ${../glossary/code-section:/term} is
      shorter than one instruction.
  - name: NotExecutable
    test-code: |
      TxPut32( ctx->buf + TxSectionHeader( ctx->buf, TX_SECTION_TEXT ) + 8, 2 );
    text: |
      While the file is an ELF file whose only SHT_PROGBITS section lacks the flag
      SHF_EXECINSTR.
  - name: NoBits
    test-code: |
      TxPut32( ctx->buf + TxSectionHeader( ctx->buf, TX_SECTION_TEXT ) + 4, 8 );
    text: |
      While the file is an ELF file whose only section with the flag SHF_EXECINSTR
      has the type SHT_NOBITS.
  - name: NoMemoryInfo
    test-code: |
      TxFailNext( TX_FAIL_CALLOC );
    text: |
      While the file is a valid ELF file, while the allocation of the instruction
      information fails.
  - name: NoMemoryTarget
    test-code: |
      TxFailNext( TX_FAIL_MALLOC );
    text: |
      While the file is a valid ELF file, while the allocation of the branch targets
      fails.
  test-epilogue: null
  test-prologue: null
rationale: |
  Dimension File covers the content of a file which is no archive, 20 states.

  The ELF specification defines the ELF header and the section header table. The
  errata checker accepts a file of the class ELFCLASS32 with the data encoding
  ELFDATA2MSB for the machine EM_SPARC or EM_SPARC32PLUS. It checks each section
  of the type SHT_PROGBITS with the flag SHF_EXECINSTR which holds at least one
  instruction.

  The test builds a relocatable ELF file whose ${../glossary/code-section:/term}
  holds a store, an ADD and a store. The state of the file changes that file. The
  ${../glossary/finding:/term} of the stale cache entry erratum for the first
  store shows that the errata checker checked the
  ${../glossary/code-section:/term}. A link time wrapper lets an allocation fail.
