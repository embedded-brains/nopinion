rationale: |
  The documents list the parts which each erratum affects.

  Every erratum which the errata checker checks affects the GR712RC.
  GRLIB-TN-0016 and GR740 erratum 20-1 affect the GR740. GRLIB-TN-0009, -0011 and
  -0018 affect the LEON3FT-RTAX. GRLIB-TN-0009, -0011, -0013, -0016 and -0018
  affect the UT699, the UT699E and the UT700.

  Section 1.2 of GRLIB-TN-0013 names only the first GR740 silicon for prototypes.
  Chapter 43 of the GR740 user manual does not list the erratum, so the errata
  checker does not check it for the GR740.
references: []
requirement-type: functional
text: |
  Where the option -p names a part, the errata checker shall check only the
  errata which affect the part.
