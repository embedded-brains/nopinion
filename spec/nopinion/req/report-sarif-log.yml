post-conditions:
- name: Log
  states:
  - name: Empty
    test-code: |
      T_eq_str( ctx->out, "" );
    text: |
      The errata checker shall write nothing to the standard output.
  - name: Successful
    test-code: |
      CheckLog( ctx, "true" );
    text: |
      The errata checker shall write one SARIF log with one run of the tool
      nopinion and one invocation whose property executionSuccessful is true.
  - name: Failed
    test-code: |
      CheckLog( ctx, "false" );
    text: |
      The errata checker shall write one SARIF log with one run of the tool
      nopinion and one invocation whose property executionSuccessful is false.
  test-epilogue: null
  test-prologue: null
- name: BaseIds
  states:
  - name: Absent
    test-code: |
      T_eq_int( strncmp( ctx->out + strlen( HEAD ), "\"results\":[\n", 12 ), 0 );
    text: |
      The run shall hold the result array after the tool.
  - name: Present
    test-code: |
      static const char ids[] = "\"originalUriBaseIds\":{\"PKG\":{}},\"results\":[\n";

      T_eq_int( strncmp( ctx->out + strlen( HEAD ), ids, sizeof( ids ) - 1 ), 0 );
    text: |
      The run shall hold the property originalUriBaseIds with the URI base id PKG
      and an empty artifact location after the tool.
  test-epilogue: null
  test-prologue: null
- name: Results
  states:
  - name: None
    test-code: |
      T_eq_int( CountLines( ctx->out ), 2 );
    text: |
      The run shall hold no result.
  - name: Definite
    test-code: |
      T_eq_int( CountLines( ctx->out ), 3 );
      CheckHead( ctx, 0, false );
    text: |
      The run shall hold one result of the level error with the rule identifier
      "TN-0009/back-to-back-store" and the message text "TN-0009
      back-to-back-store".
  - name: Possible
    test-code: |
      T_eq_int( CountLines( ctx->out ), 3 );
      CheckHead( ctx, 0, true );
    text: |
      The run shall hold one result of the level warning with the rule identifier
      "TN-0009/back-to-back-store" and the message text "TN-0009
      back-to-back-store possible".
  - name: Both
    test-code: |
      T_eq_int( CountLines( ctx->out ), 4 );
      CheckHead( ctx, 0, false );
      CheckHead( ctx, 1, true );
    text: |
      The run shall hold the result of the ${../glossary/definite-finding:/term}
      of the level error followed by the result of the
      ${../glossary/possible-finding:/term} of the level warning.
  test-epilogue: null
  test-prologue: null
- name: Artifact
  states:
  - name: Plain
    test-code: |
      CheckEach( ctx, ctx->uri, NULL );
    text: |
      The uri property of the artifact location of each result shall be the file
      operand.
  - name: Encoded
    test-code: |
      CheckEach( ctx, ctx->uri, NULL );
    text: |
      The uri property of the artifact location of each result shall be the file
      operand with each byte outside the unreserved characters and the slash of
      RFC 3986 percent-encoded.
  - name: Absolute
    test-code: |
      CheckEach( ctx, "\"artifactLocation\":{\"uri\":\"file:///", ctx->uri );
    text: |
      The uri property of the artifact location of each result shall be the URI of
      the scheme file which names the absolute file operand.
  - name: Based
    test-code: |
      CheckEach( ctx, ctx->based_uri, NULL );
    text: |
      The artifact location of each result shall hold the path of the file operand
      relative to the directory of the option -b as the uri property and the URI
      base id PKG as the uriBaseId property.
  - name: Root
    test-code: |
      CheckEach( ctx, ctx->based_uri, NULL );
      T_null( strstr( ctx->out, "{\"uri\":\"/" ) );
      T_null( strstr( ctx->out, "{\"uri\":\"file:" ) );
    text: |
      The artifact location of each result shall hold the real path of the file
      operand without its leading slash as the uri property and the URI base id
      PKG as the uriBaseId property.
  test-epilogue: null
  test-prologue: null
- name: Location
  states:
  - name: Relocatable
    test-code: |
      CheckLocations( ctx, false, "" );
    text: |
      The location of each result shall hold a physical location without an
      address with the byte offset of the instruction in the file and the byte
      length 4, and the section and the offset of the instruction in the section
      as properties.
  - name: Executable
    test-code: |
      CheckLocations( ctx, true, "" );
    text: |
      The location of each result shall hold a physical location with the byte
      offset of the instruction in the file, the byte length 4 and the absolute
      address of the instruction of the kind instruction, and the section and the
      offset of the instruction in the section as properties.
  - name: Member
    test-code: |
      CheckLocations( ctx, false, "\"member\":\"m.o\"," );
    text: |
      The location of each result shall hold a physical location without an
      address with the byte offset of the instruction in the archive and the byte
      length 4, and the member, the section and the offset of the instruction in
      the section as properties.
  test-epilogue: null
  test-prologue: null
- name: Logical
  states:
  - name: None
    test-code: |
      T_null( strstr( ctx->out, "logicalLocations" ) );
    text: |
      The errata checker shall write each result without a logical location.
  - name: Plain
    test-code: |
      CheckEach(
        ctx,
        "\"logicalLocations\":[{\"name\":\"f\",\"kind\":\"function\"}]",
        NULL
      );
    text: |
      Each result shall hold one logical location of the kind function with the
      name of the symbol.
  - name: Escaped
    test-code: |
      CheckEach(
        ctx,
        "\"logicalLocations\":[{\"name\":\"s\\\"\\\\\\u0001\",\"kind\":"
        "\"function\"}]",
        NULL
      );
    text: |
      Each result shall hold one logical location of the kind function with the
      name of the symbol as a JSON string which escapes the quotation mark, the
      reverse solidus and each control character.
  test-epilogue: null
  test-prologue: null
- name: Instructions
  states:
  - name: Absent
    test-code: |
      T_null( strstr( ctx->out, "instructions" ) );
    text: |
      The errata checker shall write each result without the instructions
      property.
  - name: Present
    test-code: |
      CheckInstructions( ctx );
    text: |
      Each result shall hold the instructions property with one object of the
      offset and the instruction word for each instruction of the instruction
      sequence, which ends with null for an
      ${../glossary/unknown-instruction:/term}.
  test-epilogue: null
  test-prologue: null
pre-conditions:
- name: Option
  states:
  - name: Plain
    test-code: |
      ctx->verbose = false;
      ctx->quiet = false;
    text: |
      While the option -f sarif is given, while the options -q and -v are not
      given.
  - name: Verbose
    test-code: |
      ctx->verbose = true;
      ctx->quiet = false;
    text: |
      While the options -f sarif and -v are given, while the option -q is not
      given.
  - name: Quiet
    test-code: |
      ctx->verbose = false;
      ctx->quiet = true;
    text: |
      While the options -f sarif and -q are given.
  test-epilogue: null
  test-prologue: null
- name: Input
  states:
  - name: Relocatable
    test-code: |
      ctx->member = false;
    text: |
      While the file operand names a relocatable ELF file.
  - name: Executable
    test-code: |
      ctx->image.executable = true;
      ctx->image.address = 0x40001000;
      ctx->member = false;
    text: |
      While the file operand names an executable ELF file.
  - name: Member
    test-code: |
      ctx->member = true;
    text: |
      While the file operand names an archive with the relocatable ELF file m.o as
      its member.
  test-epilogue: null
  test-prologue: null
- name: Name
  states:
  - name: Plain
    test-code: |
      (void) snprintf( ctx->file, sizeof( ctx->file ), "%s/t.o", ctx->dir );
      (void) snprintf(
        ctx->uri,
        sizeof( ctx->uri ),
        "\"artifactLocation\":{\"uri\":\"%s/t.o\"}",
        ctx->dir
      );
      ctx->leaf = "t.o";
    text: |
      While the file operand is a relative file name of unreserved characters and
      slashes.
  - name: Encoded
    test-code: |
      (void) snprintf(
        ctx->file,
        sizeof( ctx->file ),
        "%s/a b%%~\xc3\xa4.o",
        ctx->dir
      );
      (void) snprintf(
        ctx->uri,
        sizeof( ctx->uri ),
        "\"artifactLocation\":{\"uri\":\"%s/a%%20b%%25~%%C3%%A4.o\"}",
        ctx->dir
      );
      ctx->leaf = "a%20b%25~%C3%A4.o";
    text: |
      While the file operand is a relative file name with a space, a percent sign,
      a tilde and the bytes of a UTF-8 character.
  - name: Absolute
    test-code: |
      char cwd[ 128 ];

      T_assert_not_null( getcwd( cwd, sizeof( cwd ) ) );
      (void)
        snprintf( ctx->file, sizeof( ctx->file ), "%s/%s/t.o", cwd, ctx->dir );
      (void) snprintf( ctx->uri, sizeof( ctx->uri ), "/%s/t.o\"}", ctx->dir );
      ctx->leaf = "t.o";
    text: |
      While the file operand is an absolute file name.
  test-epilogue: null
  test-prologue: null
- name: Base
  states:
  - name: None
    test-code: |
      ctx->base = NULL;
    text: |
      While the option -b is not given.
  - name: Below
    test-code: |
      (void) snprintf(
        ctx->base_option,
        sizeof( ctx->base_option ),
        "PKG=%s",
        ctx->top
      );
      ctx->base = ctx->base_option;
      (void) snprintf(
        ctx->based_uri,
        sizeof( ctx->based_uri ),
        "\"artifactLocation\":{\"uri\":\"xy/%s\",\"uriBaseId\":\"PKG\"}",
        ctx->leaf
      );
    text: |
      While the option -b PKG=DIR names a directory which contains the directory of
      the file operand.
  - name: Root
    test-code: |
      (void) snprintf( ctx->base_option, sizeof( ctx->base_option ), "PKG=/" );
      ctx->base = ctx->base_option;
      (void) snprintf(
        ctx->based_uri,
        sizeof( ctx->based_uri ),
        "/%s/%s\",\"uriBaseId\":\"PKG\"}",
        ctx->dir,
        ctx->leaf
      );
    text: |
      While the option -b PKG=/ names the root directory.
  - name: Sibling
    test-code: |
      (void) snprintf(
        ctx->base_option,
        sizeof( ctx->base_option ),
        "PKG=%s/x",
        ctx->top
      );
      ctx->base = ctx->base_option;
    text: |
      While the option -b PKG=DIR names a directory whose path is a prefix of the
      path of the directory of the file operand and which does not contain the file
      operand.
  - name: Outside
    test-code: |
      (void) snprintf(
        ctx->base_option,
        sizeof( ctx->base_option ),
        "PKG=%s/zz",
        ctx->top
      );
      ctx->base = ctx->base_option;
    text: |
      While the option -b PKG=DIR names a directory whose path is no prefix of the
      path of the file operand and has the length of the path of the directory of
      the file operand.
  test-epilogue: null
  test-prologue: null
- name: Symbol
  states:
  - name: None
    test-code: |
      TxAddSymbol( &ctx->image, "g", 0, 0x11, TX_SECTION_TEXT );
    text: |
      While no function and no symbol without type of the
      ${../glossary/code-section:/term} exists.
  - name: Plain
    test-code: |
      /* The image holds the function f at offset 0 */
    text: |
      While the function f starts at offset 0 of the
      ${../glossary/code-section:/term}.
  - name: Escaped
    test-code: |
      TxAddSymbol( &ctx->image, "s\"\\\x01", 0, 0x12, TX_SECTION_TEXT );
    text: |
      While a function starts at offset 0 of the ${../glossary/code-section:/term}
      whose name holds a quotation mark, a reverse solidus and a control character.
  test-epilogue: null
  test-prologue: null
- name: Match
  states:
  - name: None
    test-code: |
      TxAppend( &ctx->image, TxNop() );
      ctx->count = 0;
    text: |
      While the ${../glossary/code-section:/term} holds no
      ${../glossary/finding:/term}.
  - name: Definite
    test-code: |
      TxAppend( &ctx->image, TxSt() );
      TxAppend( &ctx->image, TxAdd() );
      TxAppend( &ctx->image, TxSt() );
      TxAppend( &ctx->image, TxLd() );
      ctx->count = 1;
      ctx->offset[ 0 ] = 0;
      ctx->instructions[ 0 ] = DEFINITE_AT_0;
    text: |
      While the ${../glossary/code-section:/term} holds one
      ${../glossary/definite-finding:/term}.
  - name: Possible
    test-code: |
      TxAppend( &ctx->image, TxSt() );
      TxAppend( &ctx->image, TxAdd() );
      ctx->count = 1;
      ctx->offset[ 0 ] = 0;
      ctx->instructions[ 0 ] = POSSIBLE_AT_0;
    text: |
      While the ${../glossary/code-section:/term} holds one
      ${../glossary/possible-finding:/term}.
  - name: Both
    test-code: |
      TxAppend( &ctx->image, TxSt() );
      TxAppend( &ctx->image, TxAdd() );
      TxAppend( &ctx->image, TxSt() );
      TxAppend( &ctx->image, TxLd() );
      TxAppend( &ctx->image, TxSt() );
      TxAppend( &ctx->image, TxAdd() );
      ctx->count = 2;
      ctx->offset[ 0 ] = 0;
      ctx->offset[ 1 ] = 16;
      ctx->instructions[ 0 ] = DEFINITE_AT_0;
      ctx->instructions[ 1 ] = POSSIBLE_AT_16;
    text: |
      While the ${../glossary/code-section:/term} holds one
      ${../glossary/definite-finding:/term} followed by one
      ${../glossary/possible-finding:/term}.
  test-epilogue: null
  test-prologue: null
- name: Error
  states:
  - name: None
    test-code: |
      ctx->missing = false;
    text: |
      While each file operand names a file which exists.
  - name: Missing
    test-code: |
      ctx->missing = true;
    text: |
      While a second file operand names a file which does not exist.
  test-epilogue: null
  test-prologue: null
rationale: |
  Dimension Option covers the options -q and -v with the option -f sarif, 3
  states.

  Dimension Input covers the kinds of the file operand, 3 states.

  Dimension Name covers the forms of the file name of the URI, 3 states.

  Dimension Base covers the option -b, 5 states. A directory whose path is a
  prefix of the path of the file operand need not contain the file operand.

  Dimension Symbol covers the name of the logical location, 3 states.

  Dimension Match covers the count and the kinds of the results, 4 states.

  Dimension Error covers the property executionSuccessful, 2 states.

  The log has one line which opens the result array and one line for each
  result. One last line closes the result array and holds the invocation.

  The level error marks a ${../glossary/definite-finding:/term} and the level
  warning marks a ${../glossary/possible-finding:/term}. The rule identifier is a
  hierarchical string of the erratum and the kind of the instruction sequence.

  A byte region of the physical location gives the instruction in the file, so a
  tool reads the instruction word at that offset. SARIF has no property for the
  offset of the instruction in the section and for the member of an archive.
  They therefore go into the property bag of the location.
