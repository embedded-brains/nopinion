test-action: |
  TxArchive   archive;
  uint8_t     buf[ 4096 ];
  size_t      size;
  const uint8_t *data;
  FILE       *f;
  char       *argv[ 10 ];
  int         argc = 0;

  size = TxBuildElf( &ctx->image, buf, sizeof( buf ) );
  ctx->text_offset = TxGet32( buf + TxSectionHeader( buf, TX_SECTION_TEXT ) + 16 );
  data = buf;

  if ( ctx->member ) {
    TxArchiveInit( &archive );
    TxArchiveAdd( &archive, "m.o/", buf, size, 0 );
    data = archive.buf;
    size = archive.size;
    ctx->text_offset += 68;
  }

  f = fopen( ctx->file, "wb" );
  T_assert_not_null( f );
  T_assert_eq_sz( fwrite( data, 1, size, f ), size );
  T_assert_eq_int( fclose( f ), 0 );

  argv[ argc++ ] = "nopinion";
  argv[ argc++ ] = "-f";
  argv[ argc++ ] = "sarif";

  if ( ctx->verbose ) {
    argv[ argc++ ] = "-v";
  }

  if ( ctx->quiet ) {
    argv[ argc++ ] = "-q";
  }

  if ( ctx->base != NULL ) {
    argv[ argc++ ] = "-b";
    argv[ argc++ ] = ctx->base;
  }

  argv[ argc++ ] = "-t0009";
  argv[ argc++ ] = ctx->file;

  if ( ctx->missing ) {
    argv[ argc++ ] = ctx->missing_file;
  }

  argv[ argc ] = NULL;
  ctx->out = TxMain( argc, argv, &ctx->status );
test-brief: null
test-cleanup: |
  T_eq_int( unlink( ctx->file ), 0 );
