test-support: |
  #define HEAD \
    "{\"version\":\"2.1.0\",\"$schema\":\"https://docs.oasis-open.org/sarif/" \
    "sarif/v2.1.0/errata01/os/schemas/sarif-schema-2.1.0.json\",\"runs\":[{" \
    "\"tool\":{\"driver\":{\"name\":\"nopinion\",\"informationUri\":" \
    "\"https://github.com/embedded-brains/nopinion\"}},"

  /* ST [%o0], %g1 is 0xc2220000 and ADD %g1, 1, %g1 is 0x82006001 */
  #define DEFINITE_AT_0 \
    "\"instructions\":[{\"offset\":0,\"word\":3257008128},{\"offset\":4," \
    "\"word\":2181062657},{\"offset\":8,\"word\":3257008128}]"

  #define POSSIBLE_AT_0 \
    "\"instructions\":[{\"offset\":0,\"word\":3257008128},{\"offset\":4," \
    "\"word\":2181062657},null]"

  #define POSSIBLE_AT_16 \
    "\"instructions\":[{\"offset\":16,\"word\":3257008128},{\"offset\":20," \
    "\"word\":2181062657},null]"

  static int CountLines( const char *s )
  {
    int n = 0;

    while ( ( s = strchr( s, '\n' ) ) != NULL ) {
      ++n;
      ++s;
    }

    return n;
  }

  /*
   * Copies the result line of the index without its newline and comma.  Each
   * result line except the last ends with a comma.
   */
  static void ResultLine(
    const NopinionReqReportSarifLog_Context *ctx,
    int                           index,
    char                         *buf,
    size_t                        size
  )
  {
    const char *line = ctx->out;
    const char *end;
    size_t      n;
    int         i;

    for ( i = 0; i <= index; ++i ) {
      line = strchr( line, '\n' );
      T_assert_not_null( line );
      ++line;
    }

    end = strchr( line, '\n' );
    T_assert_not_null( end );

    T_assert_true( end > line );
    T_eq_int( end[ -1 ] == ',', index + 1 < ctx->count );

    if ( end[ -1 ] == ',' ) {
      --end;
    }

    n = (size_t) ( end - line );
    T_assert_lt_sz( n, size );
    memcpy( buf, line, n );
    buf[ n ] = '\0';
  }

  static void CheckLog( const NopinionReqReportSarifLog_Context *ctx, const char *success )
  {
    char        tail[ 128 ];
    size_t      n = strlen( ctx->out );
    size_t      m;

    (void) snprintf(
      tail,
      sizeof( tail ),
      "\n],\"invocations\":[{\"executionSuccessful\":%s}]}]}\n",
      success
    );
    m = strlen( tail );
    T_eq_int( strncmp( ctx->out, HEAD, strlen( HEAD ) ), 0 );
    T_assert_ge_sz( n, m );
    T_eq_str( ctx->out + n - m, tail );
  }

  static void CheckHead(
    const NopinionReqReportSarifLog_Context *ctx,
    int                           index,
    bool                          possible
  )
  {
    char line[ 1024 ];
    char expected[ 256 ];

    ResultLine( ctx, index, line, sizeof( line ) );
    (void) snprintf(
      expected,
      sizeof( expected ),
      "{\"ruleId\":\"TN-0009/back-to-back-store\",\"level\":\"%s\","
      "\"message\":{\"text\":\"TN-0009 back-to-back-store%s\"},"
      "\"locations\":[{\"physicalLocation\":{",
      possible ? "warning" : "error",
      possible ? " possible" : ""
    );
    T_eq_int( strncmp( line, expected, strlen( expected ) ), 0 );
  }

  /* Checks that each result line holds the strings */
  static void CheckEach(
    const NopinionReqReportSarifLog_Context *ctx,
    const char                   *a,
    const char                   *b
  )
  {
    char line[ 1024 ];
    int  i;

    for ( i = 0; i < ctx->count; ++i ) {
      ResultLine( ctx, i, line, sizeof( line ) );
      T_not_null( strstr( line, a ) );

      if ( b != NULL ) {
        T_not_null( strstr( line, b ) );
      }
    }
  }

  static void CheckLocations(
    const NopinionReqReportSarifLog_Context *ctx,
    bool                          executable,
    const char                   *member
  )
  {
    char line[ 1024 ];
    char expected[ 256 ];
    int  i;

    for ( i = 0; i < ctx->count; ++i ) {
      int n;

      ResultLine( ctx, i, line, sizeof( line ) );
      n = snprintf(
        expected,
        sizeof( expected ),
        "},\"region\":{\"byteOffset\":%u,\"byteLength\":4}",
        (unsigned) ( ctx->text_offset + ctx->offset[ i ] )
      );

      if ( executable ) {
        (void) snprintf(
          expected + n,
          sizeof( expected ) - (size_t) n,
          ",\"address\":{\"absoluteAddress\":%u,\"kind\":\"instruction\"}}",
          (unsigned) ( 0x40001000 + ctx->offset[ i ] )
        );
      } else {
        (void) snprintf( expected + n, sizeof( expected ) - (size_t) n, "}" );
      }

      T_not_null( strstr( line, expected ) );
      (void) snprintf(
        expected,
        sizeof( expected ),
        ",\"properties\":{%s\"section\":\".text\",\"offset\":%u}}]",
        member,
        (unsigned) ctx->offset[ i ]
      );
      T_not_null( strstr( line, expected ) );
    }
  }

  static void CheckInstructions( const NopinionReqReportSarifLog_Context *ctx )
  {
    char line[ 1024 ];
    char expected[ 256 ];
    int  i;

    for ( i = 0; i < ctx->count; ++i ) {
      size_t n;
      size_t m;

      ResultLine( ctx, i, line, sizeof( line ) );
      (void) snprintf(
        expected,
        sizeof( expected ),
        "}}],\"properties\":{%s}}",
        ctx->instructions[ i ]
      );
      n = strlen( line );
      m = strlen( expected );
      T_assert_ge_sz( n, m );
      T_eq_str( line + n - m, expected );
    }
  }
