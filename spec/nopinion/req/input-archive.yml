test-action: |
  if ( !ctx->empty ) {
    uint8_t buf[ 4096 ];
    size_t  size;

    if ( ctx->elf ) {
      TxImage image;

      TxImageInit( &image );
      TxAppend( &image, TxSt() );
      TxAppend( &image, TxAdd() );
      TxAppend( &image, TxSt() );
      size = TxBuildElf( &image, buf, sizeof( buf ) );
    } else {
      memcpy( buf, "text", 4 );
      size = 4;
    }

    TxArchiveAdd( &ctx->archive, ctx->name, buf, size, ctx->excess );
  }

  ctx->report = TxCheckBuffer(
    ctx->archive.buf,
    ctx->archive.size,
    NOTE_0009
  );
