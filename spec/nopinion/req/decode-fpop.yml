  test-epilogue: null
  test-prologue: null
- name: Rd
  states:
  - name: None
    test-code: |
      T_false( ctx->probe.any );
      T_eq_int( ctx->probe.width[ TX_RD ], 0 );
    text: |
      The errata checker shall treat the instruction as an instruction without a
      destination operand.
  - name: Single
    test-code: |
      T_false( ctx->probe.any );
      T_eq_int( ctx->probe.width[ TX_RD ], 1 );
    text: |
      The errata checker shall treat the destination operand of the instruction as
      one register.
  - name: Double
    test-code: |
      T_false( ctx->probe.any );
      T_eq_int( ctx->probe.width[ TX_RD ], 2 );
    text: |
      The errata checker shall treat the destination operand of the instruction as
      two registers.
  - name: Quad
    test-code: |
      T_false( ctx->probe.any );
      T_eq_int( ctx->probe.width[ TX_RD ], 4 );
    text: |
      The errata checker shall treat the destination operand of the instruction as
