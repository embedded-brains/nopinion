rationale: |
  Dimension Instruction covers the floating-point operations of tables F-5 and
  F-6 of SPARC V8, 40 states.

  Section B.33 of SPARC V8 states the operand type of each floating-point
  operation. A single operand is one register. A double operand is two registers
  which start at an even register. A quad operand is four registers which start
  at a multiple of four. An undefined opf field causes an fp_exception trap, so
  the checker treats the instruction as a dependency on every register.

  The test observes the kind through the incorrect annulation erratum and through
  the missing FDIV/FSQRT result erratum. It observes the width of an operand
  through the register dependencies of the missing FDIV/FSQRT result erratum. An
  operand at register 17 overlaps a destination at register 17. It overlaps a
  destination at register 16 only as a double or quad operand. An operand at
  register 18 overlaps a destination at register 17 only as a quad operand.
