links:
- role: requirement-refinement
  uid: decode
post-conditions:
- name: Kind
  states:
  - name: Fpop1
    test-code: |
      T_true( ctx->probe.is_fpop );
      T_false( ctx->probe.is_div );
    text: |
      The errata checker shall classify the instruction as an FPop1 instruction other
      than FDIV and FSQRT.
  - name: Div
    test-code: |
      T_true( ctx->probe.is_fpop );
      T_true( ctx->probe.is_div );
      T_false( ctx->probe.counted );
    text: |
      The errata checker shall classify the instruction as an FDIV or FSQRT
      instruction.
  - name: Fpop2
    test-code: |
      T_true( ctx->probe.is_fpop );
      T_false( ctx->probe.is_div );
      T_false( ctx->probe.counted );
    text: |
      The errata checker shall classify the instruction as an FPop2 instruction.
  test-epilogue: null
  test-prologue: null
- name: Rs1
  states:
  - name: None
    test-code: |
      T_false( ctx->probe.any );
      T_eq_int( ctx->probe.width[ TX_RS1 ], 0 );
    text: |
      The errata checker shall treat the instruction as an instruction without a
      first source operand.
  - name: Single
    test-code: |
      T_false( ctx->probe.any );
      T_eq_int( ctx->probe.width[ TX_RS1 ], 1 );
    text: |
      The errata checker shall treat the first source operand of the instruction as
      one register.
  - name: Double
    test-code: |
      T_false( ctx->probe.any );
      T_eq_int( ctx->probe.width[ TX_RS1 ], 2 );
    text: |
      The errata checker shall treat the first source operand of the instruction as
      two registers.
  - name: Quad
    test-code: |
      T_false( ctx->probe.any );
      T_eq_int( ctx->probe.width[ TX_RS1 ], 4 );
    text: |
      The errata checker shall treat the first source operand of the instruction as
      four registers.
  - name: Any
    test-code: |
      T_true( ctx->probe.any );
      T_eq_int( ctx->probe.width[ TX_RS1 ], 4 );
    text: |
      The errata checker shall treat the first source operand of the instruction as a
      dependency on every floating-point register.
  test-epilogue: null
  test-prologue: null
- name: Rs2
  states:
  - name: None
    test-code: |
      T_false( ctx->probe.any );
      T_eq_int( ctx->probe.width[ TX_RS2 ], 0 );
    text: |
      The errata checker shall treat the instruction as an instruction without a
      second source operand.
  - name: Single
    test-code: |
      T_false( ctx->probe.any );
      T_eq_int( ctx->probe.width[ TX_RS2 ], 1 );
    text: |
      The errata checker shall treat the second source operand of the instruction as
      one register.
  - name: Double
    test-code: |
      T_false( ctx->probe.any );
      T_eq_int( ctx->probe.width[ TX_RS2 ], 2 );
    text: |
      The errata checker shall treat the second source operand of the instruction as
      two registers.
  - name: Quad
    test-code: |
      T_false( ctx->probe.any );
      T_eq_int( ctx->probe.width[ TX_RS2 ], 4 );
    text: |
      The errata checker shall treat the second source operand of the instruction as
      four registers.
  - name: Any
    test-code: |
      T_true( ctx->probe.any );
      T_eq_int( ctx->probe.width[ TX_RS2 ], 4 );
    text: |
      The errata checker shall treat the second source operand of the instruction as
