enabled-by: true
functional-type: action
links:
- role: requirement-refinement
  uid: flow
post-conditions:
- name: Finding
  states:
  - name: None
    test-code: |
      T_eq_int( TxCountAt( ctx->report, 0, "TN-0009" ), 0 );
    text: |
      The errata checker shall report no ${../glossary/finding:/term} for the first
      instruction.
  - name: Definite
    test-code: |
      T_eq_int( TxCountAt( ctx->report, 0, "TN-0009" ), 1 );
      T_false( TxIsPossibleAt( ctx->report, 0, "TN-0009" ) );
    text: |
      The errata checker shall report one ${../glossary/definite-finding:/term} for
      the first instruction.
  - name: Possible
    test-code: |
      T_eq_int( TxCountAt( ctx->report, 0, "TN-0009" ), 1 );
      T_true( TxIsPossibleAt( ctx->report, 0, "TN-0009" ) );
    text: |
      The errata checker shall report one ${../glossary/possible-finding:/term} for
      the first instruction.
  test-epilogue: null
  test-prologue: null
pre-conditions:
- name: Second
  states:
  - name: TrapAlways
    test-code: |
      ctx->second = TxTa();
    text: |
      While the second instruction is a trap always instruction.
  - name: TrapCond
    test-code: |
      ctx->second = TxFormat3Imm( 2, 0x3a, 9, TX_G0, 0 );
    text: |
      While the second instruction is a conditional trap instruction.
  - name: Other
    test-code: |
      ctx->second = TxAdd();
    text: |
      While the second instruction transfers no control.
  test-epilogue: null
  test-prologue: null
- name: Indirect
  states:
  - name: 'Yes'
    test-code: |
      TxSetIncludeIndirect( true );
    text: |
      While the option -i is given.
  - name: 'No'
    test-code: |
      TxSetIncludeIndirect( false );
    text: |
      While the option -i is not given.
  test-epilogue: null
  test-prologue: null
rationale: |
  Dimension Second covers the trap instructions of SPARC V8 and an instruction
  which transfers no control, 3 states.

  Dimension Indirect covers the options of the errata checker, 2 states.

  The test checks a store of word size, the second instruction and a store of
  word size with the stale cache entry erratum. A trap always instruction
  transfers control to its trap handler, so the flow of execution ends there
  unless the option -i is given. The option makes the instruction after the trap
  an ${../glossary/unknown-instruction:/term}. A conditional trap may not trap,
  so the flow of execution continues with the next instruction.
