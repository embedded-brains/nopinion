test-action: |
  TxAppend( &ctx->image, TxSt() );
  TxAppend( &ctx->image, ctx->second );
  TxAppend( &ctx->image, TxSt() );
  TxAppend( &ctx->image, TxNop() );
  ctx->report = TxCheck( &ctx->image, NOTE_0009 );
test-brief: null
test-cleanup: |
  TxSetIncludeIndirect( false );
