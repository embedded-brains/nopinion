- role: requirement-refinement
  uid: tn-0016
post-conditions:
- name: Finding
  states:
  - name: None
    test-code: |
      T_eq_int( TxCountAt( ctx->report, 0, "stfsr-after-stfsr" ), 0 );
    text: |
      The errata checker shall report no ${../glossary/finding:/term} of an STFSR
      instruction after an STFSR instruction for the first instruction.
  - name: Definite
    test-code: |
      T_eq_int( TxCountAt( ctx->report, 0, "stfsr-after-stfsr" ), 1 );
      T_false( TxIsPossibleAt( ctx->report, 0, "stfsr-after-stfsr" ) );
    text: |
      The errata checker shall report one ${../glossary/definite-finding:/term} of
      an STFSR instruction after an STFSR instruction for the first instruction.
  - name: Possible
    test-code: |
      T_eq_int( TxCountAt( ctx->report, 0, "stfsr-after-stfsr" ), 1 );
      T_true( TxIsPossibleAt( ctx->report, 0, "stfsr-after-stfsr" ) );
    text: |
      The errata checker shall report one ${../glossary/possible-finding:/term} of
      an STFSR instruction after an STFSR instruction for the first instruction.
  test-epilogue: null
  test-prologue: null
pre-conditions:
- name: First
  states:
  - name: Stfsr
    test-code: |
      TxAppend( &ctx->image, TxStfsr() );
    text: |
      While the first instruction of the ${../glossary/code-section:/term} is an
      STFSR instruction.
  - name: Store
    test-code: |
      TxAppend( &ctx->image, TxSt() );
    text: |
      While the first instruction of the ${../glossary/code-section:/term} is a
      store other than STFSR.
  - name: Other
    test-code: |
      TxAppend( &ctx->image, TxAdd() );
    text: |
      While the first instruction of the ${../glossary/code-section:/term} is no
      store.
  test-epilogue: null
  test-prologue: null
