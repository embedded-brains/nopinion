rationale: |
  Dimension First covers the STFSR instruction, the other stores and the other
  instructions, 3 states.

  Dimension Second covers the STFSR instruction, the other instructions and the
  end of the ${../glossary/code-section:/term}, 3 states.

  Dimension Third covers the STFSR instruction, the other instructions and the
  end of the ${../glossary/code-section:/term}, 3 states.

  Dimension Fourth covers the STFSR instruction, the other instructions and the
  end of the ${../glossary/code-section:/term}, 3 states.

  Dimension Fifth covers the STFSR instruction, the other instructions and the
  end of the ${../glossary/code-section:/term}, 3 states.

  Section 4.2 of the technical note concerns an STFSR instruction after an
  fp_exception trap. The GRFPC clears the field ftt of the FSR with a delay of
  up to three instructions.
  An STFSR instruction within these three instructions may therefore store a
  non-zero ftt. Dimension Fifth shows that an STFSR instruction after them
  gives no ${../glossary/finding:/term}. A dimension after the end of the
  ${../glossary/code-section:/term} is not applicable. The instruction after the
  end of the ${../glossary/code-section:/term} is an
  ${../glossary/unknown-instruction:/term}.
