    test-code: |
      TxAppend( &ctx->image, TxStfsr() );
    text: |
      While the fifth instruction of the ${../glossary/code-section:/term} is an
      STFSR instruction.
  - name: Other
    test-code: |
      TxAppend( &ctx->image, TxAdd() );
    text: |
      While the fifth instruction of the ${../glossary/code-section:/term} is no
