test-action: |
  size_t i;

  ctx->code[ 0 ] = TxFpop1( TX_FDIVD, 16, 12, 14 );

  for ( i = 0; i < T_ARRAY_SIZE( ctx->code ); ++i ) {
    TxAppend( &ctx->image, ctx->code[ i ] );
  }

  ctx->report = TxCheck( &ctx->image, NOTE_0013 );
