test-action: |
  char *argv[ 7 ];
  int   argc = 0;

  argv[ argc++ ] = "nopinion";

  if ( ctx->part != NULL ) {
    argv[ argc++ ] = "-p";
    argv[ argc++ ] = (char *) ctx->part;
  }

  if ( ctx->errata != NULL ) {
    argv[ argc++ ] = "-t";
    argv[ argc++ ] = (char *) ctx->errata;
  }

  argv[ argc++ ] = ctx->files[ ctx->file ];
  argv[ argc ] = NULL;
  ctx->out = TxMain( argc, argv, &ctx->status );
