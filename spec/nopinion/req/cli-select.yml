post-conditions:
- name: Status
  states:
  - name: Success
    test-code: |
      T_eq_int( ctx->status, 0 );
      T_eq_str( ctx->out, "" );
    text: |
      The exit status shall be 0.
  - name: Finding
    test-code: |
      T_eq_int( ctx->status, 1 );
      T_ne_str( ctx->out, "" );
    text: |
      The exit status shall be 1.
  - name: Error
    test-code: |
      T_eq_int( ctx->status, 2 );
      T_eq_int( strncmp( TxErrors(), "usage: nopinion ", 16 ), 0 );
    text: |
      The errata checker shall write the usage text to the standard error and exit
      with the status 2.
  test-epilogue: null
  test-prologue: null
pre-conditions:
- name: Part
  states:
  - name: None
    test-code: |
      ctx->part = NULL;
    text: |
      While the option -p is not given.
  - name: Gr712rc
    test-code: |
      ctx->part = "gr712rc";
    text: |
      While the option -p names the GR712RC.
  - name: Gr740
    test-code: |
      ctx->part = "gr740";
    text: |
      While the option -p names the GR740.
  - name: Leon3ftRtax
    test-code: |
      ctx->part = "leon3ft-rtax";
    text: |
      While the option -p names the LEON3FT-RTAX.
  - name: Ut699
    test-code: |
      ctx->part = "ut699";
    text: |
      While the option -p names the UT699.
  - name: Ut699e
    test-code: |
      ctx->part = "ut699e";
    text: |
      While the option -p names the UT699E.
  - name: Ut700
    test-code: |
      ctx->part = "ut700";
    text: |
      While the option -p names the UT700.
  - name: Unknown
    test-code: |
      ctx->part = "leon3";
    text: |
      While the option -p names an unknown part.
  test-epilogue: null
  test-prologue: null
- name: Errata
  states:
  - name: None
    test-code: |
      ctx->errata = NULL;
    text: |
      While the option -t is not given.
  - name: Tn0009
    test-code: |
      ctx->errata = "0009";
    text: |
      While the option -t selects GRLIB-TN-0009.
  - name: Tn0011
    test-code: |
      ctx->errata = "0011";
    text: |
      While the option -t selects GRLIB-TN-0011.
  - name: Tn0012
    test-code: |
      ctx->errata = "0012";
    text: |
      While the option -t selects GRLIB-TN-0012.
  - name: Tn0013
    test-code: |
      ctx->errata = "0013";
    text: |
      While the option -t selects GRLIB-TN-0013.
  - name: Tn0016
    test-code: |
      ctx->errata = "0016";
    text: |
      While the option -t selects GRLIB-TN-0016.
  - name: Tn0018
    test-code: |
      ctx->errata = "0018";
    text: |
      While the option -t selects GRLIB-TN-0018.
  - name: Gr712rc8
    test-code: |
      ctx->errata = "gr712rc-8";
    text: |
      While the option -t selects GR712RC erratum 8.
  - name: Gr712rc19
    test-code: |
      ctx->errata = "gr712rc-19";
    text: |
      While the option -t selects GR712RC erratum 19.
  - name: Gr740201
    test-code: |
      ctx->errata = "gr740-20-1";
    text: |
      While the option -t selects GR740 erratum 20-1.
  test-epilogue: null
  test-prologue: null
- name: Check
  states:
  - name: Tn0009
    test-code: |
      ctx->file = 0;
    text: |
      While the file operand names an ELF file with one
      ${../glossary/definite-finding:/term} of GRLIB-TN-0009.
  - name: Tn0011
    test-code: |
      ctx->file = 1;
    text: |
      While the file operand names an ELF file with one
      ${../glossary/definite-finding:/term} of GRLIB-TN-0011.
  - name: Tn0012
    test-code: |
      ctx->file = 2;
    text: |
      While the file operand names an ELF file with one
      ${../glossary/definite-finding:/term} of GRLIB-TN-0012.
  - name: Tn0013
    test-code: |
      ctx->file = 3;
    text: |
      While the file operand names an ELF file with one
      ${../glossary/definite-finding:/term} of GRLIB-TN-0013.
  - name: Tn0016
    test-code: |
      ctx->file = 4;
    text: |
      While the file operand names an ELF file with one
      ${../glossary/definite-finding:/term} of GRLIB-TN-0016.
  - name: Tn0018
    test-code: |
      ctx->file = 5;
    text: |
      While the file operand names an ELF file with one
      ${../glossary/definite-finding:/term} of GRLIB-TN-0018.
  - name: Asi
    test-code: |
      ctx->file = 6;
    text: |
      While the file operand names an ELF file with one
      ${../glossary/definite-finding:/term} of GR712RC erratum 19 and GR740 erratum 20-1.
  - name: PowerDown
    test-code: |
      ctx->file = 7;
    text: |
      While the file operand names an ELF file with one
      ${../glossary/definite-finding:/term} of GR712RC erratum 8.
  test-epilogue: null
  test-prologue: null
rationale: |
  Dimension Part covers each part of the option -p, no option -p and an unknown
  part, 8 states.

  Dimension Errata covers each erratum name of the option -t and no option -t, 10
  states. The command line requirements cover the list form of the option -t and
  its errors.

  Dimension Check covers the checks of the errata checker, 8 states.

  The errata checker checks the errata which both the option -t and the option
  -p select. The option -p selects the errata of the table of
  ${cli-part:/name}. GR712RC erratum 19 and GR740 erratum 20-1 describe the same
  behaviour, so both names select one check. A selection without an erratum is
  an error.

  The test writes one file per check into a temporary directory of the current
  directory. Each file gives one ${../glossary/definite-finding:/term} of its
  check and no ${../glossary/finding:/term} of another check.
