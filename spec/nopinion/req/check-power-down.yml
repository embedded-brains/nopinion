  uid: power-down
post-conditions:
- name: Load
  states:
  - name: None
    test-code: |
      T_eq_int( TxCountAt( ctx->report, ctx->offset, "power-down-without-load" ), 0 );
    text: |
      The errata checker shall report no ${../glossary/finding:/term} of a write to %asr19 without the load.
  - name: Definite
    test-code: |
      T_eq_int( TxCountAt( ctx->report, ctx->offset, "power-down-without-load" ), 1 );
      T_false( TxIsPossibleAt( ctx->report, ctx->offset, "power-down-without-load" ) );
    text: |
      The errata checker shall report one ${../glossary/definite-finding:/term} of
      a write to %asr19 without the load for the write.
  - name: Possible
    test-code: |
      T_eq_int( TxCountAt( ctx->report, ctx->offset, "power-down-without-load" ), 1 );
      T_true( TxIsPossibleAt( ctx->report, ctx->offset, "power-down-without-load" ) );
    text: |
      The errata checker shall report one ${../glossary/possible-finding:/term} of
      a write to %asr19 without the load for the write.
  test-epilogue: null
  test-prologue: null
- name: Block
  states:
  - name: None
    test-code: |
      T_eq_int( TxCountAt( ctx->report, ctx->offset, "power-down-not-in-block" ), 0 );
    text: |
      The errata checker shall report no ${../glossary/finding:/term} of a write to %asr19 outside the 32-byte block of the sequence.
  - name: Definite
    test-code: |
      T_eq_int( TxCountAt( ctx->report, ctx->offset, "power-down-not-in-block" ), 1 );
      T_false( TxIsPossibleAt( ctx->report, ctx->offset, "power-down-not-in-block" ) );
    text: |
      The errata checker shall report one ${../glossary/definite-finding:/term} of
      a write to %asr19 outside the 32-byte block of the sequence for the write.
  - name: Possible
    test-code: |
      T_eq_int( TxCountAt( ctx->report, ctx->offset, "power-down-not-in-block" ), 1 );
      T_true( TxIsPossibleAt( ctx->report, ctx->offset, "power-down-not-in-block" ) );
    text: |
      The errata checker shall report one ${../glossary/possible-finding:/term} of
      a write to %asr19 outside the 32-byte block of the sequence for the write.
  test-epilogue: null
  test-prologue: null
- name: Branch
  states:
  - name: None
    test-code: |
      T_eq_int( TxCountAt( ctx->report, ctx->offset, "power-down-branch-after-load" ), 0 );
    text: |
      The errata checker shall report no ${../glossary/finding:/term} of a branch or jump after the load.
  - name: Definite
    test-code: |
      T_eq_int( TxCountAt( ctx->report, ctx->offset, "power-down-branch-after-load" ), 1 );
      T_false( TxIsPossibleAt( ctx->report, ctx->offset, "power-down-branch-after-load" ) );
    text: |
      The errata checker shall report one ${../glossary/definite-finding:/term} of
      a branch or jump after the load for the write.
  - name: Possible
    test-code: |
      T_eq_int( TxCountAt( ctx->report, ctx->offset, "power-down-branch-after-load" ), 1 );
      T_true( TxIsPossibleAt( ctx->report, ctx->offset, "power-down-branch-after-load" ) );
    text: |
      The errata checker shall report one ${../glossary/possible-finding:/term} of
      a branch or jump after the load for the write.
  test-epilogue: null
  test-prologue: null
- name: Ftahbram
  states:
  - name: None
    test-code: |
      T_eq_int( TxCountAt( ctx->report, ctx->offset, "power-down-in-ftahbram" ), 0 );
    text: |
      The errata checker shall report no ${../glossary/finding:/term} of a write to %asr19 in the FTAHBRAM.
  - name: Definite
    test-code: |
      T_eq_int( TxCountAt( ctx->report, ctx->offset, "power-down-in-ftahbram" ), 1 );
      T_false( TxIsPossibleAt( ctx->report, ctx->offset, "power-down-in-ftahbram" ) );
    text: |
      The errata checker shall report one ${../glossary/definite-finding:/term} of
      a write to %asr19 in the FTAHBRAM for the write.
  test-epilogue: null
  test-prologue: null
pre-conditions:
- name: Write
  states:
  - name: Asr19
    test-code: |
      ctx->write = TxWrasr( 19 );
    text: |
      While the write is a WRASR instruction to %asr19.
  - name: Asr18
    test-code: |
      ctx->write = TxWrasr( 18 );
    text: |
      While the write is a WRASR instruction to %asr18.
  - name: Y
    test-code: |
      ctx->write = TxWrasr( 0 );
    text: |
      While the write is a WRY instruction.
  test-epilogue: null
  test-prologue: null
- name: Load
  states:
  - name: Bypass
    test-code: |
      ctx->load = TxFormat3Asi( 3, 0x10, TX_G0, TX_O0, 0x1c, TX_G0 );
    text: |
      While the instruction after the write is an LDA instruction with the address
      space identifier 0x1C and the destination %g0.
  - name: OtherAsi
    test-code: |
      ctx->load = TxFormat3Asi( 3, 0x10, TX_G0, TX_O0, 0x0b, TX_G0 );
    text: |
      While the instruction after the write is an LDA instruction with the address
      space identifier 0x0B and the destination %g0.
  - name: OtherRegister
    test-code: |
      ctx->load = TxFormat3Asi( 3, 0x10, TX_G1, TX_O0, 0x1c, TX_G0 );
    text: |
      While the instruction after the write is an LDA instruction with the address
      space identifier 0x1C and the destination %g1.
  - name: Ld
    test-code: |
      ctx->load = TxLd();
    text: |
      While the instruction after the write is an LD instruction.
  - name: Absent
    test-code: |
      ctx->load_absent = true;
    text: |
      While the ${../glossary/code-section:/term} ends after the write.
  test-epilogue: null
  test-prologue: null
- name: Offset
  states:
  - name: Zero
    test-code: |
      ctx->index = 0;
    text: |
      While the offset of the write in its 32-byte block is 0.
  - name: Twelve
    test-code: |
      ctx->index = 3;
    text: |
      While the offset of the write in its 32-byte block is 12.
  - name: Sixteen
    test-code: |
      ctx->index = 4;
    text: |
      While the offset of the write in its 32-byte block is 16.
  test-epilogue: null
  test-prologue: null
- name: Branch
  states:
  - name: None
    test-code: |
      ctx->branch = BRANCH_NONE;
    text: |
      While no branch or jump follows the write within 15 instructions.
  - name: AfterLoad
    test-code: |
      ctx->branch = BRANCH_AFTER_LOAD;
    text: |
      While a branch follows the load.
  - name: BlockEnd
    test-code: |
      ctx->branch = BRANCH_BLOCK_END;
    text: |
      While a branch is the last instruction of the 32-byte block of the write.
  - name: NextBlock
    test-code: |
      ctx->branch = BRANCH_NEXT_BLOCK;
    text: |
      While a branch is the first instruction of the 32-byte block after the block
      of the write.
  - name: End
    test-code: |
      ctx->branch = BRANCH_END;
    text: |
      While the ${../glossary/code-section:/term} ends after the load.
  test-epilogue: null
  test-prologue: null
- name: File
  states:
  - name: BeforeFtahbram
    test-code: |
      ctx->image.executable = true;
      ctx->image.address = 0x9fffffe0;
    text: |
      While the ELF file is an executable, while the
      ${../glossary/code-section:/term} starts at 0x9FFFFFE0.
  - name: FtahbramBegin
    test-code: |
      ctx->image.executable = true;
      ctx->image.address = 0xa0000000;
    text: |
      While the ELF file is an executable, while the
      ${../glossary/code-section:/term} starts at 0xA0000000.
  - name: FtahbramLast
    test-code: |
      ctx->image.executable = true;
      ctx->image.address = 0xa00fffe0;
    text: |
      While the ELF file is an executable, while the
      ${../glossary/code-section:/term} starts at 0xA00FFFE0.
  - name: FtahbramEnd
    test-code: |
      ctx->image.executable = true;
      ctx->image.address = 0xa0100000;
    text: |
      While the ELF file is an executable, while the
      ${../glossary/code-section:/term} starts at 0xA0100000.
  - name: RelocatableAligned
    test-code: |
      ctx->image.alignment = 32;
    text: |
      While the ELF file is relocatable, while the alignment of the
      ${../glossary/code-section:/term} is an integral multiple of 32.
  - name: RelocatableUnaligned
    test-code: |
      ctx->image.alignment = 16;
    text: |
      While the ELF file is relocatable, while the alignment of the
      ${../glossary/code-section:/term} is 16.
  test-epilogue: null
  test-prologue: null
rationale: |
  Dimension Write covers the write to %asr19, the write to another ancillary
  state register and the write to %y, 3 states.

  Dimension Load covers the loads and the end of the
  ${../glossary/code-section:/term}, 5 states. The load states vary the address
  space identifier and the destination of workaround 2.

  Dimension Offset covers the offsets of the write at the bounds of workaround
  2, 3 states. The offsets 0 and 12 fit the sequence into one 32-byte block. The
  offset 16 does not.

  Dimension Branch covers the places of a branch and the end of the
  ${../glossary/code-section:/term}, 5 states. A branch follows the load
  directly, ends its block or starts the next block, or no branch exists.

  Dimension File covers the ELF file types and the bounds of the FTAHBRAM area,
  6 states.

  Section 1.7.8 of the GR712RC user manual states workaround 2. The write to
  %asr19 enters the power-down mode. The next instruction is the load
  lda [reg] 0x1C, %g0. A 32-byte block holds the write, the load and the three
  instructions after the load. No branch or jump follows the load before the
  next 32-byte boundary. The sequence does not execute from the FTAHBRAM.
  Section 1.4 maps the FTAHBRAM to the area from 0xA0000000 to 0xA0100000. A
  relocatable file fixes the offset in a 32-byte block only for a
  ${../glossary/code-section:/term} with an alignment of at least 32. It fixes no
  address in the FTAHBRAM area. Without a known 32-byte boundary, the
  ${../glossary/code-section:/term} may place the boundary up to seven
  instructions after the load. The checks of the block and of the branch need
  the load, so the load decides whether they apply. The
  ${../glossary/code-section:/term} holds 16 instructions unless it ends earlier,
  and a NOP fills each place which no dimension sets. The branch is a branch
  always instruction with annulment.
