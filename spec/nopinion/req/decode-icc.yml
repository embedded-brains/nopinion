rationale: |
  Dimension Instruction covers the instructions of table F-3 of SPARC V8 which
  transfer no control, 52 states.

  Sections B.11 to B.19 of SPARC V8 state that the instructions with the cc
  suffix modify the integer condition codes. Section B.29 states that WRPSR
  writes the PSR, which holds the integer condition codes. JMPL, RETT and Ticc
  transfer control, so the flow requirements specify them.

  The test observes the class through sequence A of the incorrect annulation
  erratum.
